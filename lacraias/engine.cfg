[application]

name="Lacraias"
main_scene="res://cenas/menu/MainMenu.tscn"
boot_splash="res://PIC1.png"
boot_splash_fullsize=true
icon="res://icon.png"

[display]

width=480
height=272
resizable=false

[input]

ui_left=[key(Left), jbutton(0, 14), key(A)]
ui_right=[key(Right), jbutton(0, 15), key(D)]
ui_up=[key(Up), jbutton(0, 12), key(W)]
ui_down=[key(Down), jbutton(0, 13), key(S)]
start_action=[jbutton(0, 11), key(Escape)]
move_left=[jbutton(0, 2), jbutton(0, 14), jbutton(0, 4)]
move_down=[jbutton(0, 0), jbutton(0, 13)]
L_action=[jbutton(0, 6)]
R_action=[jbutton(0, 7)]
move_right=[jbutton(0, 1), jbutton(0, 15), jbutton(0, 5)]
axis_up=[jaxis(0, 2)]
axis_down=[jaxis(0, 3)]
axis_left=[jaxis(0, 0)]
axis_right=[jaxis(0, 1)]
move_up=[jbutton(0, 12), jbutton(0, 3)]
select_action=[jbutton(0, 10)]

[physics]

fixed_fps=20

[physics_2d]

motion_fix_enabled=true
